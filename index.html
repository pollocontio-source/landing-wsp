<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Entretenimiento Online</title>

  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      font-family: Arial, Helvetica, sans-serif;
    }

    body {
      height: 100vh;
      background-image: url("https://media.giphy.com/media/13I3peucbA8BfG/giphy.gif");
      background-size: cover;
      background-position: center;
      background-repeat: no-repeat;
      background-attachment: fixed;
      overflow: hidden;
      display: flex;
      align-items: center;
      justify-content: center;
      color: white;
      text-align: center;
    }

    /* Capa oscura para que se lea mejor */
    body::before {
      content: "";
      position: fixed;
      inset: 0;
      background: rgba(0,0,0,0.55);
      z-index: 0;
    }

    .box {
      position: relative;
      z-index: 2;
      padding: 40px;
      border-radius: 16px;
      background: rgba(0,0,0,0.6);
      box-shadow: 0 0 30px rgba(255,215,0,0.3);
      max-width: 90%;
    }

    h1 {
      font-size: 2.2rem;
      margin-bottom: 10px;
      color: gold;
    }

    p {
      font-size: 1.1rem;
      margin-bottom: 25px;
      opacity: 0.9;
    }

    /* BOTÓN WHATSAPP */
    .btn {
      display: inline-block;
      padding: 15px 28px;
      background: #25d366;
      color: black;
      font-weight: bold;
      border-radius: 50px;
      text-decoration: none;
      font-size: 1.1rem;
      box-shadow: 0 0 15px rgba(37,211,102,0.6);
      animation: pulse 1.6s infinite;
    }

    .btn:hover {
      transform: scale(1.07);
      box-shadow: 0 0 25px rgba(37,211,102,0.9);
    }

    /* ANIMACIÓN DE LATIDO */
    @keyframes pulse {
      0% {
        transform: scale(1);
        box-shadow: 0 0 0 0 rgba(37, 211, 102, 0.7);
      }
      70% {
        transform: scale(1.06);
        box-shadow: 0 0 0 22px rgba(37, 211, 102, 0);
      }
      100% {
        transform: scale(1);
        box-shadow: 0 0 0 0 rgba(37, 211, 102, 0);
      }
    }

    .small {
      margin-top: 15px;
      font-size: 0.85rem;
      opacity: 0.7;
    }
  </style>
</head>

<body>

  <div class="box">
    <h1>Casino Online</h1>
    <p>Atención inmediata · Disponible 24 hs</p>

    <a 
      class="btn"
      href="https://wa.me/5492236953176?text=Hola%20vengo%20del%20anuncio,%20quiero%20mi%20usuario%20para%20jugar"
      target="_blank"
    >
      WhatsApp 📲
    </a>

    <div class="small">
      Pedime tu usuario
    </div>
  </div>

</body>
</html>
