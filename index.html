<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Entretenimiento Online</title>

  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      font-family: Arial, Helvetica, sans-serif;
    }

    body {
      height: 100vh;
      background: radial-gradient(circle at top, #2b1055, #000);
      overflow: hidden;
      display: flex;
      align-items: center;
      justify-content: center;
      color: white;
      text-align: center;
    }

    .coins {
      position: absolute;
      width: 100%;
      height: 100%;
      background-image: url("https://i.imgur.com/7QFQKZC.png");
      background-size: 120px;
      animation: fall 20s linear infinite;
      opacity: 0.15;
    }

    @keyframes fall {
      from { background-position: 0 -1000px; }
      to { background-position: 0 1000px; }
    }

    .box {
      position: relative;
      z-index: 2;
      padding: 40px;
      border-radius: 16px;
      background: rgba(0,0,0,0.6);
      box-shadow: 0 0 30px rgba(255,215,0,0.3);
      max-width: 90%;
    }

    h1 {
      font-size: 2.2rem;
      margin-bottom: 10px;
      color: gold;
    }

    p {
      font-size: 1.1rem;
      margin-bottom: 25px;
      opacity: 0.9;
    }

    a {
      display: inline-block;
      padding: 15px 28px;
      background: #25d366;
      color: black;
      font-weight: bold;
      border-radius: 50px;
      text-decoration: none;
      font-size: 1.1rem;
      transition: transform 0.2s, box-shadow 0.2s;
      box-shadow: 0 0 15px rgba(37,211,102,0.6);
    }

    a:hover {
      transform: scale(1.05);
      box-shadow: 0 0 25px rgba(37,211,102,0.9);
    }

    .small {
      margin-top: 15px;
      font-size: 0.85rem;
      opacity: 0.7;
    }
  </style>
</head>

<body>
  <div class="coins"></div>

  <div class="box">
    <h1>Entretenimiento Online</h1>
    <p>Atención inmediata · Disponible 24 hs</p>

    <a href="https://wa.me/2235297306" target="_blank">
      Escribime por WhatsApp
    </a>

    <div class="small">
      Respuesta rápida
    </div>
  </div>
</body>
</html>
